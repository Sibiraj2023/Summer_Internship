<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Cards</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Our Products</h1>

<div class="container">

    <div class="card">
        <img src="laptop.jpg" alt="Laptop">
        <h2>Laptop</h2>
        <p>Price: ₹45,000</p>
        <button>Buy Now</button>
    </div>

    <div class="card">
        <img src="headphones.jpg" alt="Headphones">
        <h2>Headphones</h2>
        <p>Price: ₹2,500</p>
        <button>Buy Now</button>
    </div>

    <div class="card">
        <img src="watch.jpg" alt="Watch">
        <h2>Smart Watch</h2>
        <p>Price: ₹3,999</p>
        <button>Buy Now</button>
    </div>

</div>

</body>
</html>
