<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Menu</title>
    <link rel="stylesheet" href="restaurant.css">
</head>
<body>

<div class="overlay">

    <h1>🍽 Delicious Restaurant</h1>

    <div class="category">
        <button>Pizza</button>
        <button>Burger</button>
        <button>Pasta</button>
        <button>Desserts</button>
    </div>

    <div class="menu">

        <div class="card">
            <img src="images/pizza.jpg" alt="">
            <h2>Cheese Pizza</h2>
            <p>Loaded with fresh mozzarella.</p>
            <span>₹299</span>
        </div>

        <div class="card">
            <img src="images/burger.jpg" alt="">
            <h2>Chicken Burger</h2>
            <p>Grilled chicken with cheese.</p>
            <span>₹249</span>
        </div>

        <div class="card">
            <img src="images/pasta.jpg" alt="">
            <h2>White Sauce Pasta</h2>
            <p>Creamy and delicious.</p>
            <span>₹279</span>
        </div>

        <div class="card">
            <img src="images/dessert.jpg" alt="">
            <h2>Chocolate Cake</h2>
            <p>Soft chocolate dessert.</p>
            <span>₹199</span>
        </div>

    </div>

</div>

</body>
</html>
