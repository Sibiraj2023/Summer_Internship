<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Amazon Navbar</title>
<link rel="stylesheet" href="amazon.css">
</head>
<body>

<nav class="navbar">

  <!-- Logo -->
  <div class="logo">
    <div class="logo-text">amaz<span>on</span></div>
    <div class="logo-sub">.com</div>
  </div>

  <!-- Search Box -->
  <div class="search-box">
    <select class="search-select">
      <option>All</option>
      <option>Electronics</option>
      <option>Books</option>
      <option>Fashion</option>
      <option>Home &amp; Kitchen</option>
    </select>
    <input class="search-input" type="text" placeholder="Search Amazon">
    <button class="search-button" aria-label="Search">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
    </button>
  </div>

  <!-- Sign In -->
  <div class="signin">
    <span class="signin-greeting">Hello, Sign in</span>
    <span class="signin-title">Account &amp; Lists ▾</span>
  </div>

  <!-- Cart -->
  <div class="cart">
    <span style="position: relative;">
      <svg class="cart-icon" viewBox="0 0 24 24"><path d="M7 18c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm10 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zM7.16 16h9.69c.75 0 1.41-.41 1.75-1.03l3.24-6.21A1 1 0 0 0 20.96 7H6.21l-.94-2H1v2h2.21l3.6 7.59-1.35 2.44C4.52 17.37 5.48 19 7 19h12v-2H7.16c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63z"/></svg>
      <span class="cart-count">3</span>
    </span>
    <span class="cart-label">Cart</span>
  </div>

</nav>

</body>
</html>
