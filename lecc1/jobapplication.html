<!DOCTYPE html>
<html>
<head>
  <title>Job Application Form</title>
  <style>
    body {
      font-family: Arial;
      background-color: #f0f0f0;
    }

    h1 {
      text-align: center;
    }

    form {
      background-color: #fff;
      padding: 20px;
      width: 400px;
      margin: auto;
      border: 1px solid #000;
    }

    label {
      display: block;
      margin-top: 10px;
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"],
    input[type="date"],
    input[type="number"],
    input[type="file"],
    select,
    textarea {
      margin-top: 5px;
      width: 100%;
      padding: 4px;
      box-sizing: border-box;
    }

    textarea {
      height: 70px;
      resize: vertical;
    }

    .skills {
      margin-top: 5px;
    }

    .skills label {
      display: inline;
      margin-left: 4px;
      margin-right: 10px;
    }

    input[type="radio"] {
      margin-left: 6px;
    }

    input[type="submit"] {
      margin-top: 15px;
      background-color: lightblue;
      border: 1px solid #000;
      padding: 8px 20px;
      cursor: pointer;
      width: 100%;
    }

    input[type="reset"] {
      margin-top: 8px;
      background-color: #f8f8f8;
      border: 1px solid #000;
      padding: 8px 20px;
      cursor: pointer;
      width: 100%;
    }
  </style>
</head>
<body>

  <h1>Job Application Form</h1>

  <form>

    <label>Full Name:</label>
    <input type="text" name="fullname" placeholder="Enter your full name">

    <label>Email:</label>
    <input type="email" name="email" placeholder="Enter your email">

    <label>Phone Number:</label>
    <input type="tel" name="phone" placeholder="Enter your phone number">

    <label>Date of Birth:</label>
    <input type="date" name="dob">

    <label>Gender:</label>
    <select name="gender">
      <option value="">Select</option>
      <option>Male</option>
      <option>Female</option>
      <option>Other</option>
    </select>

    <label>Highest Qualification:</label>
    <select name="qualification">
      <option value="">Select</option>
      <option>10th</option>
      <option>12th</option>
      <option>Diploma</option>
      <option>UG (BCA / B.Sc / B.E)</option>
      <option>PG (MCA / M.Sc / M.E)</option>
    </select>

    <label>Years of Experience:</label>
    <input type="number" name="experience" placeholder="e.g. 0, 1, 2..." min="0">

    <label>Job Role Applying For:</label>
    <select name="jobrole">
      <option value="">Select</option>
      <option>Web Developer</option>
      <option>Python Developer</option>
      <option>Data Analyst</option>
      <option>UI/UX Designer</option>
      <option>Software Tester</option>
    </select>

    <label>Employment Type:</label>
    <div class="skills">
      <input type="radio" name="emptype" value="fulltime"> <label>Full Time</label>
      <input type="radio" name="emptype" value="parttime"> <label>Part Time</label>
      <input type="radio" name="emptype" value="internship"> <label>Internship</label>
    </div>

    <label>Skills:</label>
    <div class="skills">
      <input type="checkbox" name="skills" value="HTML"> HTML
      <input type="checkbox" name="skills" value="CSS"> CSS
      <input type="checkbox" name="skills" value="JavaScript"> JavaScript
      <input type="checkbox" name="skills" value="Python"> Python
      <input type="checkbox" name="skills" value="C++"> C++
      <input type="checkbox" name="skills" value="SQL"> SQL
    </div>

    <label>Address:</label>
    <textarea name="address" placeholder="Enter your address"></textarea>

    <label>Upload Resume:</label>
    <input type="file" name="resume">

    <input type="submit" value="Submit Application">
    <input type="reset" value="Clear Form">

  </form>

</body>
</html>
