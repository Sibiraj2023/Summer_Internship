<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Report Card</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #1a1a2e;
            --cream: #fdf6ec;
            --gold: #c9933a;
            --gold-light: #f0d49a;
            --accent: #2e4057;
            --green: #2d6a4f;
            --red: #c1121f;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--cream);
            font-family: 'DM Sans', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
            background-image:
                radial-gradient(circle at 10% 20%, rgba(201,147,58,0.07) 0%, transparent 50%),
                radial-gradient(circle at 90% 80%, rgba(46,64,87,0.07) 0%, transparent 50%);
        }

        .card {
            background: #fff;
            border: 1px solid #e8dcc8;
            border-radius: 4px;
            width: 100%;
            max-width: 560px;
            box-shadow: 0 8px 40px rgba(26,26,46,0.1), 0 2px 8px rgba(201,147,58,0.08);
            overflow: hidden;
            animation: fadeUp 0.6s ease both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .card-header {
            background: var(--accent);
            padding: 32px 36px 28px;
            position: relative;
            overflow: hidden;
        }

        .card-header::before {
            content: '';
            position: absolute;
            top: -30px; right: -30px;
            width: 160px; height: 160px;
            border-radius: 50%;
            background: rgba(201,147,58,0.12);
        }

        .card-header::after {
            content: '';
            position: absolute;
            bottom: -20px; left: 60px;
            width: 100px; height: 100px;
            border-radius: 50%;
            background: rgba(255,255,255,0.04);
        }

        .label {
            font-size: 10px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--gold-light);
            font-weight: 600;
            margin-bottom: 8px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            color: #fff;
            font-size: 26px;
            letter-spacing: 0.5px;
            line-height: 1.2;
        }

        .gold-line {
            width: 48px;
            height: 3px;
            background: var(--gold);
            margin-top: 14px;
            border-radius: 2px;
        }

        .card-body {
            padding: 0 0 28px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead tr {
            background: var(--ink);
        }

        thead th {
            padding: 14px 20px;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: var(--gold-light);
            text-align: left;
        }

        thead th:nth-child(2),
        thead th:nth-child(3) {
            text-align: center;
        }

        tbody tr {
            border-bottom: 1px solid #f0e8d8;
            transition: background 0.2s;
            animation: rowIn 0.4s ease both;
        }

        tbody tr:nth-child(1) { animation-delay: 0.1s; }
        tbody tr:nth-child(2) { animation-delay: 0.18s; }
        tbody tr:nth-child(3) { animation-delay: 0.26s; }
        tbody tr:nth-child(4) { animation-delay: 0.34s; }
        tbody tr:nth-child(5) { animation-delay: 0.42s; }

        @keyframes rowIn {
            from { opacity: 0; transform: translateX(-10px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        tbody tr:hover { background: #fdf0dc; }
        tbody tr:last-child { border-bottom: none; }

        tbody td {
            padding: 15px 20px;
            font-size: 14.5px;
            color: var(--ink);
        }

        tbody td:nth-child(2) {
            text-align: center;
            font-weight: 600;
            color: var(--accent);
        }

        tbody td:nth-child(3) {
            text-align: center;
        }

        .grade-badge {
            display: inline-block;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            line-height: 30px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0;
        }

        .grade-A {
            background: #d8f3dc;
            color: var(--green);
        }

        .grade-B {
            background: #fff3cd;
            color: #856404;
        }

        .grade-C {
            background: #f8d7da;
            color: var(--red);
        }

        .card-footer {
            padding: 18px 20px 4px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 8px;
            border-top: 1px dashed #e0d0b8;
            margin: 0 16px;
        }

        .footer-text {
            font-size: 11px;
            color: #999;
            letter-spacing: 0.5px;
        }

        .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); display: inline-block; }
    </style>
</head>
<body>
    <div class="card">
        <div class="card-header">
            <div class="label">Academic Record</div>
            <h1>Student Report Card</h1>
            <div class="gold-line"></div>
        </div>
        <div class="card-body">
            <table>
                <thead>
                    <tr>
                        <th>Subject</th>
                        <th>Mark</th>
                        <th>Grade</th>
                    </tr>
                </thead>
                <tbody id="cont">
                    <tr>
                        <td>English</td>
                        <td>92</td>
                        <td><span class="grade-badge grade-A">A</span></td>
                    </tr>
                    <tr>
                        <td>Language</td>
                        <td>97</td>
                        <td><span class="grade-badge grade-A">A</span></td>
                    </tr>
                    <tr>
                        <td>Maths</td>
                        <td>87</td>
                        <td><span class="grade-badge grade-B">B</span></td>
                    </tr>
                    <tr>
                        <td>Physics</td>
                        <td>89</td>
                        <td><span class="grade-badge grade-B">B</span></td>
                    </tr>
                    <tr>
                        <td>Biology</td>
                        <td>90</td>
                        <td><span class="grade-badge grade-A">A</span></td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer">
            <span class="dot"></span>
            <span class="footer-text">Academic Year 2025–26</span>
        </div>
    </div>
</body>
</html>
